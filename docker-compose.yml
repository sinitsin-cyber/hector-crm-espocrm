# EspoCRM на своем компьютере
# Урок 5, часть 2: своя CRM без сервера
#
# Перед запуском: открой Docker Desktop и дождись, пока он загрузится.
#
# Запуск (в терминале VS Code, в папке с этим файлом):
#   docker compose up -d
# или просто попроси Claude Code запустить этот файл.
#
# Первый запуск занимает несколько минут: Docker скачивает CRM и базу.
# Потом открой в браузере: http://localhost:8080
# Логин: admin, пароль: ADMIN_PASSWORD из файла .env (образец: .env.example).
#
# Остановить CRM:     docker compose stop
# Запустить снова:    docker compose start
# Данные при этом сохраняются.
#
# НЕ ЗАПУСКАЙ docker compose down --volumes (или -v): это удалит всю базу CRM.
# Удаление самого Docker Desktop тоже сотрет все данные CRM.
#
# Основа: официальный пример для EspoCRM 10
# (docs.espocrm.com/administration/docker/installation/, раздел Docker Compose).
# Пример из урока подключал весь /var/www/html одним томом. С EspoCRM 10 так
# нельзя: образ видит «legacy installation», CRM не устанавливается, обновлений
# не будет. Поэтому три отдельных тома: data, custom и client/custom.

services:

  # База данных: здесь хранятся клиенты, сделки, задачи
  espocrm-db:
    image: mariadb:latest
    container_name: espocrm-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?задайте в .env}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${DB_PASSWORD:?задайте в .env}
    volumes:
      - espocrm-db:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3

  # Сама CRM, открывается на http://localhost:8080
  espocrm:
    image: espocrm/espocrm:latest
    container_name: espocrm
    environment:
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD:?задайте в .env}
      # Логин и пароль админа. Срабатывают только при самом первом запуске,
      # дальше пароль меняется уже внутри CRM.
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте в .env}
      ESPOCRM_SITE_URL: "http://localhost:8080"
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-custom-client:/var/www/html/client/custom
    restart: unless-stopped
    depends_on:
      espocrm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 60s
      timeout: 20s
      retries: 3
    ports:
      - 8080:80

  # Фоновые задачи: напоминания и плановые действия
  espocrm-daemon:
    image: espocrm/espocrm:latest
    container_name: espocrm-daemon
    volumes_from:
      - espocrm
    restart: unless-stopped
    entrypoint: docker-daemon.sh
    depends_on:
      espocrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 180s
      timeout: 20s
      retries: 3

  # Мгновенные уведомления в интерфейсе
  espocrm-websocket:
    image: espocrm/espocrm:latest
    container_name: espocrm-websocket
    environment:
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
      ESPOCRM_CONFIG_WEB_SOCKET_URL: "ws://localhost:8081"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: "tcp://*:7777"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: "tcp://espocrm-websocket:7777"
    volumes_from:
      - espocrm
    restart: unless-stopped
    entrypoint: docker-websocket.sh
    depends_on:
      espocrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 180s
      timeout: 20s
      retries: 3
    ports:
      - 8081:8080

volumes:
  espocrm-db:
  espocrm-data:
  espocrm-custom:
  espocrm-custom-client:
